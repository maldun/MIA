# Amendment 5 (decided by the owner 2026-10-25, D-45): the top-level cut of MIA. Check with decomp_check.py.
# Top and high level are cut now; the low nodes are Planned (name and subject only) and are split just in
# time, risky ones first. The cut is in the HLS section 5.5.
# Interface ids start at IF-101 because specs/number-gate already uses IF-001..IF-004.
decomposition:
  system: mia
  levels: [top, high, low]
  limits: {children_min: 2, children_max: 7, leaf_tasks: 8, leaf_interfaces: 3}

  nodes:
    - id: N-0
      name: MIA
      level: top
      subject: MiaSystem
      folder: specs/mia
      status: Draft
      children: [N-1, N-2, N-3, N-4, N-5]

    - id: N-1
      name: Web Frontend
      level: high
      subject: WebFrontEnd
      folder: specs/mia/nodes/N-1-web-frontend
      # NFR-9: static files, shipped inside the backend container (N-2); no container of its own
      status: Draft
      test_stage: 2
      children: [N-1.1, N-1.2, N-1.3]
      boundary:
        - {interface: IF-101, role: consumes, child: N-1.1}

    - id: N-2
      name: Backend
      level: high
      subject: WebApplication
      folder: specs/mia/nodes/N-2-backend
      status: Draft
      test_stage: 3
      children: [N-2.1, N-2.2, N-2.3, N-2.4, N-2.5]
      boundary:
        - {interface: IF-101, role: provides, child: N-2.1}
        - {interface: IF-104, role: provides, child: N-2.1}
        - {interface: IF-102, role: consumes, child: N-2.1}
        - {interface: IF-102, role: consumes, child: N-2.2}
        - {interface: IF-102, role: consumes, child: N-2.3}
        - {interface: IF-102, role: consumes, child: N-2.4}
        - {interface: IF-103, role: consumes, child: N-2.4}

    - id: N-3
      name: Database
      level: high
      subject: Persistence
      folder: specs/mia/nodes/N-3-database
      status: Draft
      test_stage: 2
      children: [N-3.1, N-3.2, N-3.3]
      boundary:
        - {interface: IF-102, role: provides, child: N-3.1}

    - id: N-4
      name: Evaluation and operation
      level: high
      subject: Evaluation
      folder: specs/mia/nodes/N-4-evaluation-operation
      status: Draft
      test_stage: 4
      children: []
      tasks: 6
      early_stop: "tooling and operation scripts, one concern; cut further only if it grows"

    - id: N-5
      name: Graph app
      level: high
      subject: GraphApp
      folder: specs/mia/nodes/N-5-graph-app
      status: Draft
      test_stage: 2
      children: []
      tasks: 6
      early_stop: "an independent tool with one concern (owner, D-2)"

    - id: N-1.1
      name: Chat and login views
      level: low
      subject: WebFrontEnd
      folder: specs/mia/nodes/N-1-web-frontend/nodes/N-1.1-chat-and-login-views
      status: Planned
      children: []

    - id: N-1.2
      name: Character view
      level: low
      subject: WebFrontEnd
      folder: specs/mia/nodes/N-1-web-frontend/nodes/N-1.2-character-view
      status: Planned
      children: []

    - id: N-1.3
      name: Voice playback (TTS)
      level: low
      subject: WebFrontEnd
      folder: specs/mia/nodes/N-1-web-frontend/nodes/N-1.3-voice-playback
      status: Planned
      children: []

    - id: N-2.1
      name: API and accounts
      level: low
      subject: WebApplication
      folder: specs/mia/nodes/N-2-backend/nodes/N-2.1-api-and-accounts
      status: Planned
      children: []
      tasks: 6                          # estimates until the node is planned
      test_stage: 2
      leaf_exception: "the gateway: two interfaces face outward (IF-101, IF-104) and three inward (IF-201, IF-203, IF-102); the inward ones are single-call clients, the node stays one routing layer"

    - id: N-2.2
      name: Chat agent
      level: low
      subject: ConversationCore
      folder: specs/mia/nodes/N-2-backend/nodes/N-2.2-chat-agent
      status: Planned
      children: []
      tasks: 8
      test_stage: 3                     # model-dependent behaviour is decided by evals (stage 4)
      leaf_exception: "the hub of the persona: IF-201 outward, IF-202 and IF-204 as single-call clients and IF-102 as storage client; cut again by concern (conversation and queue, memory, feedback and adaptation) if the plan exceeds 8 tasks"

    - id: N-2.3
      name: Workflow management
      level: low
      subject: TaskRuntime
      folder: specs/mia/nodes/N-2-backend/nodes/N-2.3-workflow-management
      status: Planned
      children: []
      tasks: 7
      test_stage: 2

    - id: N-2.4
      name: Workflow execution
      level: low
      subject: TaskRuntime
      folder: specs/mia/nodes/N-2-backend/nodes/N-2.4-workflow-execution
      status: Planned
      children: []
      tasks: 8
      test_stage: 4
      leaf_exception: "holds 35 requirements and four interfaces; it is the doubtful, model-dependent part (FR-9, FR-11) and is cut again into runtime, verification, research and run log (low-2) before its plan, risky nodes first"

    - id: N-2.5
      name: Voice synthesis
      level: low
      subject: VoiceSubsystem
      folder: specs/mia/nodes/N-2-backend/nodes/N-2.5-voice-synthesis
      status: Planned
      children: []
      tasks: 4
      test_stage: 2

    - id: N-3.1
      name: Storage layer and accounts tables
      level: low
      subject: Persistence
      folder: specs/mia/nodes/N-3-database/nodes/N-3.1-storage-layer
      status: Planned
      children: []

    - id: N-3.2
      name: Workflows and context graphs
      level: low
      subject: Persistence
      folder: specs/mia/nodes/N-3-database/nodes/N-3.2-workflows-and-context-graphs
      status: Planned
      children: []

    - id: N-3.3
      name: Memories, history and user feedback
      level: low
      subject: Persistence
      folder: specs/mia/nodes/N-3-database/nodes/N-3.3-memories-history-feedback
      status: Planned
      children: []

  interfaces:
    - id: IF-101
      name: Chat, expression and REST API (browser to server)
      provider: N-2
      consumers: [N-1]
      decided_by: N-0
      version: v0
      mock:
        complexity: 3               # Socket.IO events with a stream of sentences and expressions
        kind: fake
        location: tests/helpers/mocks/if_101_chat_api.py
        does: ["accepts login, a chat message, answers with scripted sentences and expression events"]
        does_not: ["real model latency", "real budgets", "history persistence"]
      spec: contracts/IF-101-chat-api.md
      suite: tests/acceptance/contract/test_if_101_chat_api.py

    - id: IF-102
      name: Storage interface (state of all apps)
      provider: N-3
      consumers: [N-2]              # the graph app goes through the backend API IF-104 (owner, D-47)
      decided_by: N-0
      version: v0
      mock:
        complexity: 2              # in-memory fake of the storage layer
        kind: fake
        location: tests/helpers/mocks/if_102_storage.py
        does: ["reads and writes records of every table in memory", "returns the documented errors"]
        does_not: ["transactions across tables", "concurrent writers", "backup and restore"]
      spec: contracts/IF-102-storage-interface.md
      suite: tests/acceptance/contract/test_if_102_storage.py

    - id: IF-103
      name: Model server (chat completion with structured output)
      provider: ext:ollama
      owner: N-2
      consumers: [N-2]
      decided_by: N-0
      version: v0
      mock:
        complexity: 3               # the fake model server of pipeline.py (scripted replies)
        kind: fake
        location: tests/helpers/mocks/if_103_model_server.py
        does: ["scripted replies, token counts, errors and timeouts"]
        does_not: ["quality of a real model (eval criteria are decided on the pinned model)"]
      spec: contracts/IF-103-model-server.md
      suite: tests/acceptance/contract/test_if_103_model_server.py

    - id: IF-104
      name: Workflow and graph API (REST with the backend's session)
      provider: N-2
      consumers: [N-5]
      decided_by: N-0
      version: v0
      mock:
        complexity: 2               # a fake REST server: login, list, read, save versions, history, diff, restore
        kind: fake
        location: tests/helpers/mocks/if_104_graph_api.py
        does: ["login and session", "list and read workflows and context graphs", "save a version, history, diff, restore", "refuse an invalid graph with the broken rule named"]
        does_not: ["the real graph rules beyond a fixed list of cases", "concurrent edits"]
      spec: contracts/IF-104-graph-api.md
      suite: tests/acceptance/contract/test_if_104_graph_api.py

    # Decision D-2/D-47 (HLS section 5.5): the graph app N-5 is an independent tool and goes through the backend API
    # (IF-104). The backend validates edits (TB-edit); N-3.1 validates again.
    # Search and scholarly services (SearXNG, scholarly APIs) are external providers of N-2.4; their
    # interfaces are recorded when N-2.4 is cut again.

    # Interfaces between the children of N-2 (decided by N-2, amendment 8 / D-48)
    - id: IF-201
      name: Chat turn service (API and accounts to chat agent)
      provider: N-2.2
      consumers: [N-2.1]
      decided_by: N-2
      version: v0
      mock:
        complexity: 3               # a stream of events, a queue
        kind: fake
        location: tests/helpers/mocks/if_201_chat_turn.py
        does: ["send for an account, queue position, stop, history, the event stream of one scripted answer"]
        does_not: ["model latency", "persistence", "persona and mood"]
      spec: contracts/IF-201-chat-turn.md
      suite: tests/acceptance/contract/test_if_201_chat_turn.py

    - id: IF-202
      name: Run a workflow
      provider: N-2.4
      consumers: [N-2.2, N-2.3]
      decided_by: N-2
      version: v0
      mock:
        complexity: 3               # budgets, a stream of run events, costs
        kind: fake
        location: tests/helpers/mocks/if_202_run_workflow.py
        does: ["run a workflow version with a scripted result", "budget end with what is missing", "event stream", "measured cost of a node"]
        does_not: ["real model calls", "real verification and research"]
      spec: contracts/IF-202-run-workflow.md
      suite: tests/acceptance/contract/test_if_202_run_workflow.py

    - id: IF-203
      name: Workflow library
      provider: N-2.3
      consumers: [N-2.1, N-2.2, N-2.4]
      decided_by: N-2
      version: v0
      mock:
        complexity: 2               # in-memory library on the storage mock
        kind: fake
        location: tests/helpers/mocks/if_203_workflow_library.py
        does: ["list, read, save a version, history, diff, restore", "lifecycle status", "estimate of a run from stored costs"]
        does_not: ["the real graph rules beyond the shared rule module", "specification and benchmark records"]
      spec: contracts/IF-203-workflow-library.md
      suite: tests/acceptance/contract/test_if_203_workflow_library.py

    - id: IF-204
      name: Speech synthesis
      provider: N-2.5
      consumers: [N-2.2]
      decided_by: N-2
      version: v0
      mock:
        complexity: 2               # returns short generated audio bytes
        kind: fake
        location: tests/helpers/mocks/if_204_speech.py
        does: ["synthesise a sentence to an audio chunk", "deliver a voice line", "the documented errors"]
        does_not: ["the sound of the real voice", "the anime effect"]
      spec: contracts/IF-204-speech.md
      suite: tests/acceptance/contract/test_if_204_speech.py

  integration:
    - node: N-0
      skeleton: tests/integration/N-0/step_00
      order:
        - {child: N-3, test: tests/integration/N-0/step_01}
        - {child: N-4, test: tests/integration/N-0/step_02}
        - {child: N-1, test: tests/integration/N-0/step_03}
        - {child: N-2, test: tests/integration/N-0/step_04}
        - {child: N-5, test: tests/integration/N-0/step_05, reason: "an add-on tool (owner, 2026-10-25): MIA is complete and usable without it, so it is integrated last"}
    - node: N-2
      skeleton: tests/integration/N-2/step_00
      order:
        - {child: N-2.5, test: tests/integration/N-2/step_01}
        - {child: N-2.3, test: tests/integration/N-2/step_02}
        - {child: N-2.4, test: tests/integration/N-2/step_03, reason: "risky first: the model-dependent part (FR-9, FR-11) and the largest node; its interfaces IF-202 and IF-203 are mocks until then"}
        - {child: N-2.2, test: tests/integration/N-2/step_04}
        - {child: N-2.1, test: tests/integration/N-2/step_05}

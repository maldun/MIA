  REQ-CHA-062:
    basis: no number, measurement or model quality depends on it; the behaviour is fixed by an exact acceptance
      criterion on a scripted run with the fake model, no real model (proposal of the agent, 2026-11-08,
      G-V3.CHAT)
    proposed: plausible
    text: When SkillDigestStep has digested the pieces of a result, the Chat agent shall have it write the

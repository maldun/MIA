# MIA as a service: MIA (this folder), Ollama (the language model) and SearXNG (web search).
#   deploy/up.sh                                   first start: makes .env and the config, starts everything (CPU)
#   deploy/up.sh rocm | nvidia                     with the GPU of Ollama (AMD / NVIDIA)
# The page is on http://localhost:8585 (MIA_PORT / MIA_BIND in .env change that). Only MIA (http, 8585) and its https front (8586) are published; Ollama and SearXNG are reachable inside the stack.
# More in deploy/README.md.
services:
  mia:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/mia:latest
    restart: unless-stopped
    depends_on:
      - searxng
    environment:
      MIA_PUBLIC_PORT: ${MIA_PORT:-8585}
      MIA_PUBLIC_HTTPS_PORT: ${MIA_HTTPS_PORT:-8586}      # the pages that come through the https service may use the socket
      MIA_PUBLIC_HOSTS: ${MIA_PUBLIC_HOSTS:-}              # addresses of this machine for other devices (up.sh fills it with MIA_BIND=0.0.0.0)
      MIA_OLLAMA_HOST: ${OLLAMA_URL:-http://ollama:11434}      # OLLAMA_URL in .env: an Ollama that exists already, see README
      MIA_DATABASE_URL: ${MIA_DATABASE_URL:-}                  # set by  deploy/up.sh db  (the storage option picks the database)
    ports:
      - "${MIA_BIND:-127.0.0.1}:${MIA_PORT:-8585}:8585"
    volumes:
      - ${MIA_CONFIG:-./setup_cfg.compose.json}:/opt/mia/MIA/setup_cfg.json:ro,z
      - ./setup_cfg.local.json:/opt/mia/MIA/setup_cfg.local.json:ro,z      # the settings of THIS machine (the login ...), not in git; up.sh makes it ({}) when it is missing
      - mia-data:/opt/mia/MIA/data
      - ${MIA_KOKORO_DIR:-../voice/models/kokoro}:/opt/mia/MIA/voice/models/kokoro:ro,z
      - ${MIA_CHARACTER_DIR:-../ui/godot/build/web}:/opt/mia/MIA/ui/godot/build/web:ro,z
      - ${MIA_BACKGROUND_DIR:-../backgrounds}:/opt/mia/MIA/backgrounds:ro,z      # new pictures appear on a reload of the page, no rebuild

  https:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on:
      - mia
    ports:
      - "${MIA_BIND:-127.0.0.1}:${MIA_HTTPS_PORT:-8586}:8586"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data

  ollama:
    profiles: ["ollama"]          # only without OLLAMA_URL (up.sh switches the profile)
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # The shared state (N-3.1, REQ-SLY-010/011): PostgreSQL for several instances. Only with  deploy/up.sh db  (profile db). No port is published: it is
  # reachable from the containers of this stack only (their network), never from the host or the home network. The schema of deploy/db/ runs at the first
  # start of an empty volume, so the tables exist whether the container is started alone or by the stack.
  db:
    profiles: ["db"]
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mia
      POSTGRES_DB: mia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}            # up.sh db makes it in .env; the image refuses an empty one
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia -d mia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run deploy/up.sh, it makes .env}
    volumes:
      - ../tools/searxng/settings.yml:/etc/searxng/settings.yml:ro,z

volumes:
  mia-data:
  caddy-data:
  ollama:
  pgdata:

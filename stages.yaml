# Stage ladder of MIA (blueprint M27): every check has a stage by the time it needs.
#   0 edit loop (seconds)   1 commit gate (< 2 min)   2 commit stage (<= 10 min, clean environment)
#   3 acceptance stage (<= 30 min)   4 long run (hours; scheduled and before integration)
# Run:  python ~/.claude/skills/dev-workflow/scripts/run_stages.py --stages stages.yaml --upto 1
# Stage 4 is the eval runs with the pinned model (python tools/eval.py ..., decided by eval_decide.py against the baseline of the criterion);
# it has no step here until the first node plan names its suites and repeats. required_for_merge therefore lists 1 to 3 for now.
stages:
  budget_s: {0: 10, 1: 120, 2: 600, 3: 1800}
  required_for_merge: [1, 2, 3]
  review_starts_after: 3
  long_run_max_age_days: 7

steps:
  - {id: model-ids,    stage: 0, cmd: "python3 -I tools/check_sysml_model.py .", needs: []}
  # trace joins this ladder with T-14 (node requirements in the model): until then trace_check.py reports their ids as missing in architecture.sysml
  # - {id: trace,      stage: 1, cmd: "python3 -I ~/.claude/skills/dev-workflow/scripts/trace_check.py --spec-dir specs/mia --tests-dir tests", needs: []}
  - {id: quality,      stage: 1, cmd: "python3 -I ~/.claude/skills/plan-phase/scripts/quality_check.py --quality specs/mia/quality.md --requirements specs/mia/requirements.md specs/mia/nodes/*/requirements.md specs/mia/nodes/*/nodes/*/requirements.md specs/mia/nodes/*/nodes/*/nodes/*/requirements.md", needs: []}
  - {id: decomposition, stage: 1, cmd: "python3 -I ~/.claude/skills/decomposition/scripts/decomp_check.py --record specs/mia/decomposition.yaml --root .", needs: []}
  - {id: sysml-parse,  stage: 1, cmd: "bash tools/check_sysml.sh", needs: [model-ids]}
  - {id: js,           stage: 1, cmd: "node --test \"tests/js/*.test.mjs\"", needs: []}
  - {id: unit,         stage: 1, cmd: "python -m unittest discover -s tests -q", needs: []}
  - {id: contract-mocks, stage: 1, cmd: "python -m unittest discover -s tests/acceptance/contract -p \"test_if_*.py\" -k _mock", needs: [unit]}
  - {id: contract-js,  stage: 1, cmd: "node --test tests/acceptance/contract/test_if_111_character_bridge.test.mjs tests/acceptance/contract/test_if_112_voice_player.test.mjs", needs: []}
  # one process per file: test_stability.py (protected) puts tests/ on sys.path, so one discover run fails on the names that tests/ and tests/acceptance/ share (test_workflow_library, test_number_gate)
  - {id: acceptance,   stage: 2, cmd: "rc=0; for f in tests/acceptance/test_*.py; do python \"$f\" || rc=1; done; exit $rc", needs: [unit]}
  - {id: contract-real, stage: 2, cmd: "python -m unittest discover -s tests/acceptance/contract -p \"test_if_*.py\" -k _real", needs: [acceptance]}
  # contract-postgres (A-59): the IF-102 suite on a throwaway postgres:16 (local image, never pulled); MIA_DB_PYTHON names a python with psycopg 3
  - {id: contract-postgres, stage: 3, cmd: "bash tools/contract_postgres.sh", needs: [contract-real]}
  - {id: integration,  stage: 2, cmd: "python3 -I tools/run_integration_steps.py .", needs: [contract-real]}
  # container-alone (A-64): TC-API-013, the mia image alone in a pod against the HTTP stand-in of IF-103; needs podman and localhost/mia:latest (never pulled); a skip fails the step (D-169)
  - {id: container-alone, stage: 3, cmd: "bash tools/container_alone.sh", needs: [unit]}
  # no smoke step (A-88, TD-25): tests/smoke/ runs on the owner's workstation in the Deploy phase (goals/G-V1/deploy-plan.md)
  # G-V2.CONVERT (Plan step 3, 2026-11-07): stage 4 holds TC-WFM-110 to 114, one eval run of each converted skill on its dev suite, e.g.
  #   python tools/eval.py run <suite> --pin MP-light --repeats 3   then   eval_decide.py --criterion "<Eval criterion of REQ-WFM-110 to 114>"
  # They are not steps yet: the converted runner and the tags split:dev (A-120) do not exist. The Implement task that builds the runner adds them here
  # (stage 4, needs: [acceptance]); TC-WFM-057 to 066, 069 and 115 run in stage 2 with the acceptance step, TC-WFM-060 (inspection) in stage 1.
